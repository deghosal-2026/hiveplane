apiVersion: hiveplane/v1
kind: AgentWorkload
metadata:
  name: context-guard-probe
  owner: support-team
  team: support
  description: Context-budget probe — a tiny context ceiling forces a guard pause (S12).
  labels:
    environment: field-test
    source: field_test
spec:
  runtime:
    adapter: raw-worker
    entrypoint: field_test.shims.budget_agent:run
  model:
    strategy: tiered
    identity:
      provider: omlx
      family: qwen3-4b-instruct-2507
      version: "4bit"
  guards:
    context_tokens: 1
  certification:
    benchmark_corpus: corpora/support-agent/hiveplane-corpus.yaml
    staging_threshold: 0.80
    production_threshold: 0.90
    no_critical_failures: true
    latency_budget_ms: 30000
    re_cert_interval: 14d
    status: uncertified
  tools:
    allow:
      - tool_id: mcp.github.read_issue
        trust_level: read_only
      - tool_id: mcp.github.read_large_issue
        trust_level: read_only
    default_trust: read_only
  budget:
    per_run_usd: 0.50
    per_day_usd: 5.00
    per_team_usd: 50.00
  sandbox:
    enabled: true
    resource_caps:
      memory_mb: 512
      cpu_cores: 1.0
      wall_clock_s: 300
    egress:
      allow: ["api.github.com"]
      deny: ["169.254.169.254"]
      mode: restricted
    filesystem: isolated
  output_shaping:
    max_bytes: 16384
    truncate_strategy: tail
    injection_scan: true
  fan_out:
    on_completed:
      - type: slack
        channel: "#support-agent-results"
    on_failed:
      - type: slack
        channel: "#support-oncall"
    always_include: [trace_link]
  observability:
    contract: standard
    trace_sampling: 1.0
