[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hiveplane"
version = "0.1.0"
description = "Control plane for production agent fleets: registry, certification, run lifecycle, policy, budget, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HivePlane Contributors" }]
keywords = ["agents", "control-plane", "certification", "ai-infrastructure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "cryptography>=43",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]
langgraph = ["langgraph>=0.2"]

[project.urls]
Homepage = "https://github.com/deghosal-2026/hiveplane"
Repository = "https://github.com/deghosal-2026/hiveplane"
Issues = "https://github.com/deghosal-2026/hiveplane/issues"

[project.scripts]
hiveplane = "hiveplane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/hiveplane"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM",
  "PTH", "RUF", "TID", "ANN",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["hiveplane"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false