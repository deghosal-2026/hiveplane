[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hiveplane"
version = "0.2.0"
description = "Control plane for production agent fleets: registry, certification, run lifecycle, policy, budget, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HivePlane Contributors" }]
keywords = ["agents", "control-plane", "certification", "ai-infrastructure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "cryptography>=43",
  "typer>=0.12",
  "pyyaml>=6.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]
langgraph = ["langgraph>=0.2"]
pydantic-ai = ["pydantic-ai-slim>=0.0.20"]
openai-agents = ["openai-agents>=0.1"]

[project.urls]
Homepage = "https://github.com/deghosal-2026/hiveplane"
Repository = "https://github.com/deghosal-2026/hiveplane"
Issues = "https://github.com/deghosal-2026/hiveplane/issues"

[project.scripts]
hiveplane = "hiveplane.cli:main"
hiveplane-ui = "hiveplane.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveplane"]

[tool.hatch.build.targets.sdist]
# Ship sources only. An explicit allow-list (not exclude) guarantees no
# field-test evidence or vendored third-party agent code can leak into the sdist.
only-include = [
  "src/hiveplane",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m 'not e2e and not docker'"
markers = [
  "e2e: browser end-to-end tests (run with `make test-e2e`)",
  "docker: container tests that require a running Docker daemon (run with `pytest tests/docker -m docker`)",
]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
    # psycopg connections pooled by an engine that is garbage-collected without an
    # explicit dispose() raise from BaseConnection.__del__; harmless cleanup noise.
    # (Message regex cannot contain ':' — pytest's filter format splits on it.)
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src/hiveplane"]
omit = [
  "src/hiveplane/persistence/run_store.py",
  "src/hiveplane/persistence/postgres_audit.py",
  "src/hiveplane/persistence/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100
extend-exclude = ["field_test"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM",
  "PTH", "RUF", "TID", "ANN",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"scripts/**" = ["T201"]
# The report generator's literals are markdown documents, not code.
"scripts/field_test_report.py" = ["E501", "RUF001", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["hiveplane"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# This test imports the field-test harness from scripts/ (not a package on the
# mypy path); the harness is exercised end-to-end, not type-checked here.
[[tool.mypy.overrides]]
module = ["test_field_test_runner", "tests.test_field_test_runner"]
ignore_missing_imports = true
disallow_untyped_defs = false