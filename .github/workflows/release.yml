# Build, sign, and publish a HivePlane release (M59-06).
# Supply chain: SBOM (syft), cosign-signed images, SLSA-style provenance,
# Python sdist/wheel to PyPI, and a Homebrew formula update.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for component in api ui; do
            docker buildx build --push -f "Dockerfile.${component}" \
              -t "${REGISTRY}/${IMAGE}-${component}:${TAG}" .
          done

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}-api
          format: spdx-json
          output-file: sbom-api.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.spdx.json

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Sign images
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for component in api ui; do
            cosign sign --yes "${REGISTRY}/${IMAGE}-${component}:${TAG}"
          done

  provenance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit SLSA-style provenance
        run: |
          python scripts/release_provenance.py --tag "${GITHUB_REF_NAME#v}" \
            --out provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: provenance.json

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm package deploy/helm/hiveplane --destination dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
