name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: lint · type · test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      HIVEPLANE_DATABASE__HOST: localhost
      HIVEPLANE_DATABASE__PORT: "5432"
      HIVEPLANE_DATABASE__NAME: hiveplane
      HIVEPLANE_DATABASE__USER: hiveplane
      HIVEPLANE_DATABASE__PASSWORD: hiveplane

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hiveplane
          POSTGRES_USER: hiveplane
          POSTGRES_PASSWORD: hiveplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiveplane -d hiveplane"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph]"

      - name: Ruff
        run: ruff check

      - name: Mypy (strict)
        run: mypy src/ tests/

      - name: Migrate database
        run: alembic upgrade head

      - name: Pytest with coverage gate
        run: pytest --cov=src/hiveplane --cov-report=term-missing --cov-fail-under=95
