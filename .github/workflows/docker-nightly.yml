name: Docker nightly

# Full container-layer suite (L0-L7) against real local inference. The suite
# MUST fail — never skip — when the local LLM is unavailable, so this runs on a
# self-hosted macOS runner with OMLX (mlx_lm.server) already serving on
# 127.0.0.1:8000. Runner labels: self-hosted, macos, hiveplane-omlx.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-nightly
  cancel-in-progress: false

jobs:
  docker-full:
    name: docker · L0-L7 (local LLM required)
    runs-on: [self-hosted, macos, hiveplane-omlx]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph]"

      # Requires OMLX running on the runner host; the script preflights it and
      # aborts non-zero if it is missing.
      - name: Run full docker suite
        run: scripts/docker-test.sh

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-evidence
          path: |
            field_test/v0.1.0/docker/**
            docs/field-test/v0.1.0/DOCKER_TEST_REPORT.md
            docs/field-test/v0.1.0/screenshots/**
          if-no-files-found: warn