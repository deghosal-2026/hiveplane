name: Docker nightly v0.2.0

# Full v0.2.0 container + scenario suite (L0-L13 + S1-S25 + load test) against real local
# inference. The suite MUST fail - never skip - when the local LLM is unavailable, so this
# runs on a self-hosted macOS runner with OMLX (mlx_lm.server) serving 127.0.0.1:8000.
# Runner labels: self-hosted, macos, hiveplane-omlx.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-nightly-v02
  cancel-in-progress: false

jobs:
  docker-full-v02:
    name: docker v0.2.0 - L0-L13 + S1-S25 (local LLM required)
    runs-on: [self-hosted, macos, hiveplane-omlx]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph]"
          python -m playwright install chromium

      # Requires OMLX running on the runner host (Qwen3-4B-Instruct-2507-4bit); the script
      # preflights it and aborts non-zero if it is missing.
      - name: Run full v0.2.0 docker suite
        run: scripts/docker-test-v02.sh

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-v02-run-evidence
          path: |
            field_test/v0.2.0/docker/**
            field_test/v0.2.0/results/**
            docs/field-test/v0.2.0/DOCKER_TEST_REPORT.md
            docs/field-test/v0.2.0/LOAD_TEST_REPORT.md
            docs/field-test/v0.2.0/screenshots/**
          if-no-files-found: warn
