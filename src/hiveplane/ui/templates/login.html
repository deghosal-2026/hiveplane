{% extends "base.html" %}
{% block title %}Sign in · HivePlane{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="banner error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <p>
    <label for="api_key">API key</label><br />
    <input id="api_key" name="api_key" type="password" required autocomplete="off" />
  </p>
  <p>
    <label for="tenant_id">Tenant (optional)</label><br />
    <input id="tenant_id" name="tenant_id" type="text" />
  </p>
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
