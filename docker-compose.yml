name: hiveplane

# Compose profiles select the optional LLM backends:
#   --profile ci      fake/replay provider, hermetic (no network, no secrets)
#   --profile local   ollama service at http://ollama:11434/v1 (see .env.local)
#   --profile cloud   OpenAI at https://api.openai.com/v1 (see .env.cloud)
#   --profile test    webhook-sink captures Slack/generic webhook deliveries
#
# Provider selection comes from the env file; combine the two:
#   docker compose --env-file .env.ci    --profile ci    up -d
#   docker compose --env-file .env.local --profile local up -d
#   docker compose --env-file .env.cloud --profile cloud up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiveplane}
      POSTGRES_USER: ${POSTGRES_USER:-hiveplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiveplane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hiveplane} -d ${POSTGRES_DB:-hiveplane}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "13133:13133"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HIVEPLANE_ENVIRONMENT: ${HIVEPLANE_ENVIRONMENT:-local}
      HIVEPLANE_DATABASE__HOST: postgres
      HIVEPLANE_DATABASE__PORT: "5432"
      HIVEPLANE_DATABASE__NAME: ${POSTGRES_DB:-hiveplane}
      HIVEPLANE_DATABASE__USER: ${POSTGRES_USER:-hiveplane}
      HIVEPLANE_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:-hiveplane}
      HIVEPLANE_REDIS__HOST: redis
      HIVEPLANE_REDIS__PORT: "6379"
      HIVEPLANE_OTEL__ENDPOINT: http://otel-collector:4318
      HIVEPLANE_EXECUTION__ADAPTER: raw-worker
      HIVEPLANE_EXECUTION__STORE: postgres
      HIVEPLANE_MODEL__PROVIDER: ${HIVEPLANE_MODEL__PROVIDER:-fake}
      HIVEPLANE_MODEL__BASE_URL: ${HIVEPLANE_MODEL__BASE_URL:-}
      HIVEPLANE_MODEL__API_KEY: ${HIVEPLANE_MODEL__API_KEY:-}
      HIVEPLANE_FANOUT__SLACK_WEBHOOK_URL: ${HIVEPLANE_FANOUT__SLACK_WEBHOOK_URL:-}
      HIVEPLANE_FANOUT__GENERIC_WEBHOOK_URL: ${HIVEPLANE_FANOUT__GENERIC_WEBHOOK_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["hiveplane-ui"]
    environment:
      HIVEPLANE_UI__API_URL: http://api:8000
    ports:
      - "${UI_PORT:-3001}:8000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local LLM backend (OpenAI-compatible). Enable with --profile local and
  # point the API at it with HIVEPLANE_MODEL__BASE_URL=http://ollama:11434/v1.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Captures fan-out deliveries for the docker field test. Enable with
  # --profile test and point the API at it with
  # HIVEPLANE_FANOUT__SLACK_WEBHOOK_URL=http://webhook-sink:8081/slack and
  # HIVEPLANE_FANOUT__GENERIC_WEBHOOK_URL=http://webhook-sink:8081/webhook.
  webhook-sink:
    image: python:3.12-slim
    profiles: ["test"]
    command: ["python", "/app/deploy/webhook-sink/server.py"]
    environment:
      WEBHOOK_SINK_PORT: "8081"
    volumes:
      - ./deploy/webhook-sink:/app/deploy/webhook-sink:ro
      - webhook-sink-data:/data
    ports:
      - "${WEBHOOK_SINK_PORT:-8081}:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  ollama-data:
  webhook-sink-data:
